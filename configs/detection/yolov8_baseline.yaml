# YOLOv8 Baseline Configuration
# Standard closed-set object detection baseline

_base_: "../base_config.yaml"

model:
  name: "yolov8_baseline"
  arch: "yolov8n"  # yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  pretrained: true
  pretrained_weights: "yolov8n.pt"
  num_classes: 4  # Known classes only for baseline

  # Backbone settings
  backbone:
    type: "CSPDarknet"
    depth_multiple: 0.33
    width_multiple: 0.25

  # Neck settings
  neck:
    type: "PANet"
    in_channels: [256, 512, 1024]
    out_channels: 256

  # Detection head
  head:
    type: "YOLOv8Head"
    num_classes: 4
    anchors: "auto"  # anchor-free

training:
  epochs: 100
  batch_size: 16
  img_size: [640, 640]
  device: "cuda"
  amp: true

  # YOLOv8 specific training settings
  close_mosaic: 10  # Disable mosaic for last N epochs
  mosaic: 1.0
  mixup: 0.1
  copy_paste: 0.1
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  flipud: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

optimizer:
  name: "SGD"
  lr: 0.01
  momentum: 0.937
  weight_decay: 5.0e-4
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

# Loss weights
loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5

# Inference
inference:
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300
  agnostic_nms: false
